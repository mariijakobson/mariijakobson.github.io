name: Update index closing values

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-index-closes.yml'
      - 'FAtoolbox/scripts/update-indices.mjs'
      - 'FAtoolbox/tests/indices.test.mjs'
  schedule:
    - cron: '17 4,5,6,8,10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: index-closing-values
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Locate toolbox
        shell: bash
        run: |
          if [ -f FAtoolbox/scripts/update-indices.mjs ]; then
            echo 'TOOLBOX_PATH=FAtoolbox' >> "$GITHUB_ENV"
          else
            echo 'TOOLBOX_PATH=.' >> "$GITHUB_ENV"
          fi
      - name: Check closing-date rules
        run: node "$TOOLBOX_PATH/tests/indices.test.mjs"
      - name: Download daily closing observations
        id: download
        continue-on-error: true
        run: node "$TOOLBOX_PATH/scripts/update-indices.mjs"
      - name: Publish updated data and failure status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Regenerate against the latest branch on conflict; never force-push.
          published=false
          for attempt in 1 2 3; do
            git add "$TOOLBOX_PATH/data/indices.json"
            if git diff --cached --quiet; then
              published=true
              break
            fi
            git commit -m 'Update daily index closing data'
            if git push origin HEAD:main; then
              published=true
              break
            fi
            git fetch origin main
            git reset --hard origin/main
            # A partial download still writes per-index failure status for publication.
            node "$TOOLBOX_PATH/scripts/update-indices.mjs" || true
          done
          if [ "$published" != true ]; then
            echo '::error::Could not publish index data after three attempts.'
            exit 1
          fi
          # Publishing can fail transiently after data has already been committed.
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Report incomplete data update
        if: steps.download.outcome == 'failure'
        run: |
          echo 'One or more indices failed to update. Previous values and warning status were retained.'
          exit 1

