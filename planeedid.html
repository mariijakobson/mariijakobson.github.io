  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;background:radial-gradient(ellipse at 89% 8%,rgba(217,178,108,.09),transparent 28%),radial-gradient(ellipse at 15% 60%,rgba(130,185,178,.1),transparent 38%),var(--bg);color:var(--ink);font:17px/1.55 var(--body)}button{font:inherit}.wrap{width:min(1160px,calc(100% - 48px));margin:auto}.topbar{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:28px 0 12px}.brand{font:italic 500 1.45rem var(--heading);color:var(--ink);text-decoration:none}.brand span{color:var(--accent)}.scale-toggle{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;min-height:44px;margin-top:0;transform:translateY(56px);padding:9px 18px;border:1px solid var(--accent);border-radius:999px;background:rgba(217,178,108,.09);color:var(--ink);cursor:pointer;font-size:.9rem}.scale-toggle:hover{border-color:var(--teal);color:var(--ink)}.scale-toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}.scale-toggle:disabled{opacity:.55;cursor:wait}
    .intro{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end;padding:48px 0 26px}.eyebrow{margin:0 0 12px;color:var(--teal);font-size:.88rem}.intro h1{margin:0;font:500 clamp(3.4rem,8vw,6.7rem)/.9 var(--heading);letter-spacing:-.055em}.intro h1 em{color:var(--accent);font-weight:500}.intro p{max-width:31rem;margin:0;color:var(--muted);font-style:italic}.note{margin-top:16px;color:var(--muted);font-size:.86rem}.note strong{color:var(--ink);font-weight:500}
    .space-wrap{overflow:visible;padding:14px 0 34px}.space{position:relative;isolation:isolate;width:100%;height:690px;overflow:visible;border-radius:48% 52% 44% 56% / 10% 11% 89% 90%;background:radial-gradient(ellipse at 54% 52%,rgba(40,91,100,.14),transparent 54%),radial-gradient(ellipse at 13% 90%,rgba(217,178,108,.07),transparent 26%)}.space:before{content:'';position:absolute;inset:8% 4%;border-radius:53% 47% 59% 41% / 38% 63% 37% 62%;border:0;transform:rotate(-4deg);pointer-events:none}.orbits{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.orbits ellipse,.orbits path{fill:none;stroke:rgba(130,185,178,.25);stroke-width:1.25}.sun{position:absolute;z-index:-1;left:-740px;top:205px;width:900px;height:310px;border-radius:54% 46% 49% 51% / 45% 56% 44% 55%;background:radial-gradient(ellipse at 98% 42%,rgba(255,237,175,.29),rgba(217,178,108,.13) 22%,transparent 55%),radial-gradient(ellipse at 91% 65%,rgba(130,185,178,.08),transparent 48%);filter:blur(6px);transform:rotate(-2deg)}.sun:after{display:none}.space-copy{position:absolute;z-index:2;top:0;left:30px;max-width:310px}.space-copy h1{margin:0 0 8px;font:500 clamp(1.9rem,3.4vw,2.7rem)/1 var(--heading);letter-spacing:-.02em}.space-copy p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.5}
    .planet{-webkit-tap-highlight-color:transparent;position:absolute;z-index:1;left:var(--x);top:var(--y);width:var(--size);height:var(--size);padding:0;border:0;background:none;color:var(--ink);cursor:pointer;transform:translate(-50%,-50%);transition:opacity 220ms,filter 220ms,transform 220ms,width 220ms,height 220ms}.planet:hover,.planet:focus-visible{transform:translate(-50%,-50%) scale(1.08);filter:drop-shadow(0 0 16px rgba(217,178,108,.34));outline:none}.planet:focus-visible .planet-name{outline:none}.planet img{display:block;width:100%;height:100%;object-fit:contain;transform:scale(var(--asset-scale,1));transform-origin:center;pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none;user-select:none}.planet.fallback-orb img{display:none}.planet.fallback-orb:before{content:'';display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 32% 28%,#e3dfc9,var(--planet-color,#82b9b2) 40%,#08151f 84%);box-shadow:inset -14px -11px 18px #06121c99,0 0 18px color-mix(in srgb,var(--planet-color,#82b9b2) 42%,transparent)}.planet-name{position:absolute;left:50%;top:var(--label-top);transform:translateX(-50%);white-space:nowrap;color:var(--muted);font-size:.86rem;text-shadow:0 1px 10px var(--bg)}.planet[data-name="Jupiter"] .planet-name,.planet[data-name="Saturn"] .planet-name{color:var(--ink)}.space.is-exploring .planet:not(.is-active){opacity:.46;filter:blur(.65px) brightness(.68) saturate(.72)}.space.is-exploring .planet.is-active{z-index:5;width:var(--focus-size);height:var(--focus-size);transform:translate(-50%,-50%);filter:drop-shadow(0 0 22px rgba(217,178,108,.45))}.space.is-exploring .planet.is-active .planet-name{top:var(--active-label-top);color:var(--ink)}
    .details{position:absolute;z-index:7;width:min(330px,calc(100% - 32px));padding:18px 20px;background:radial-gradient(ellipse at 92% 18%,rgba(217,178,108,.12),transparent 45%),rgba(10,29,39,.9);border:1px solid rgba(130,185,178,.22);border-radius:49% 51% 45% 55% / 15% 18% 82% 85%;box-shadow:0 16px 38px rgba(0,0,0,.22);opacity:0;pointer-events:none;transform:translate(0,-10%);transition:opacity 180ms,transform 180ms}.details.is-visible{opacity:1}.details.to-left{transform:translate(-100%,-10%)}.details.to-top{transform:translate(0,-88%)}.details.to-left.to-top{transform:translate(-100%,-88%)}.details p{margin:0;color:var(--muted);font-size:.82rem}.details h2{margin:3px 0 2px;font:500 2rem/1 var(--heading)}.facts{display:grid;grid-template-columns:1fr;gap:0;margin:12px 0 0}.facts div{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px solid rgba(158,177,178,.14)}.facts dt{color:var(--muted);font-size:.78rem}.facts dd{margin:0;text-align:right;white-space:nowrap;font-weight:500;font-size:.8rem}.loading{display:grid;place-items:center;height:100%;color:var(--muted)}
    @media(max-width:700px){.wrap{width:calc(100% - 32px)}.planet{touch-action:manipulation;-webkit-touch-callout:none}.topbar{padding:20px 0 8px}.scale-toggle{transform:translateY(30px);font-size:.66rem;line-height:1.15;padding:6px 10px;min-height:32px;white-space:nowrap}.intro{grid-template-columns:1fr;gap:18px;padding-top:28px}.space-wrap{margin-inline:-16px;height:385px;overflow:hidden;padding:0}.space{width:192%;min-width:0;height:690px;transform:scale(.52);transform-origin:top left}.space-copy{top:18px}.details{grid-template-columns:1fr;padding:28px 22px;margin-bottom:48px}.facts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar"><span aria-hidden="true"></span><button class="scale-toggle" id="scale-toggle" type="button" disabled>Planeetide tegelike suuruste võrdlus</button></header>
    <main>
      <section class="space-wrap" aria-label="Planeetide suuruste võrdlus"><div class="space" id="space"><div class="sun" aria-hidden="true"></div><div class="space-copy"><h1>Päikesesüsteem</h1><p>Päikesesüsteem tekkis umbes 4,6 miljardit aastat tagasi. Päike sisaldab ligi 99,8% kogu süsteemi massist.</p></div><svg class="orbits" id="orbits" viewBox="0 0 1000 900" preserveAspectRatio="none" aria-hidden="true"></svg><section class="details" id="planet-card" aria-live="polite" aria-labelledby="detail-title"><div><p class="eyebrow" id="detail-order">05 / Päikesest</p><h2 id="detail-title">Jupiter</h2><p id="detail-summary">Päikesesüsteemi suurim planeet.</p></div><dl class="facts" id="facts"></dl></section><p class="loading" id="loading">Planeedid koguvad end vaatesse…</p></div></section>
    </main>
  </div>
  <script>
    let positions={};
    const summaries={Merkuur:'Päikesele lähim ja Päikesesüsteemi väikseim planeet.',Veenus:'Paksu atmosfääriga kuum kiviplaneet.',Maa:'Meie sinine koduplaneet, mille pinnal voolab vedel vesi.',Marss:'Külm ja tolmune punakas kiviplaneet.',Jupiter:'Päikesesüsteemi suurim planeet ja gaasihiid.',Saturn:'Rõngastega gaasihiid, mille ümber tiirleb palju kuid.',Uraan:'Külm jäähiid, mis pöörleb peaaegu külili.',Neptuun:'Kõige kaugem planeet, kus puhuvad väga kiired tuuled.'};
    const labels={tüüp:'Tüüp',kaugusPäikesest:'Kaugus Päikesest',läbimõõt:'Läbimõõt',gravitatsioon:'Gravitatsioon',ööpäevaPikkus:'Ööpäeva pikkus',aastaPikkus:'Aasta pikkus',temperatuur:'Keskmine temperatuur',kuudeArv:'Kuude arv'};
    const imageNames={Saturn:'saturn-realistic.png'};
    const assetScales={Merkuur:1.18,Veenus:1.16,Maa:1.22,Marss:1.2,Jupiter:1.15,Saturn:1.55,Uraan:1.24,Neptuun:1.16};
    const units={kaugusPäikesest:'mln km',läbimõõt:'km',gravitatsioon:'m/s²',ööpäevaPikkus:'h',aastaPikkus:'Maa päeva',temperatuur:'°C',kuudeArv:''};
    const format=value=>new Intl.NumberFormat('et-EE').format(value);
    function showDetails(planet){document.getElementById('detail-order').textContent=String(planet.järjekordPäikesest).padStart(2,'0')+' / Päikesest';document.getElementById('detail-title').textContent=planet.nimi;document.getElementById('detail-summary').textContent=summaries[planet.nimi]||'Planeet, mida saad võrrelda teiste Päikesesüsteemi maailmadega.';const facts=document.getElementById('facts');facts.replaceChildren();Object.keys(labels).forEach(key=>{const row=document.createElement('div');const term=document.createElement('dt');const value=document.createElement('dd');term.textContent=labels[key];const content=typeof planet[key]==='number'?format(planet[key]):planet[key];value.textContent=content+(units[key]?' '+units[key]:'');row.append(term,value);facts.append(row);});}
    const fallbackPlanets=[
      {nimi:'Merkuur',tüüp:'kiviplaneet',järjekordPäikesest:1,kaugusPäikesest:57.9,läbimõõt:4879,gravitatsioon:3.7,ööpäevaPikkus:4222.6,aastaPikkus:88,temperatuur:167,kuudeArv:0},
      {nimi:'Veenus',tüüp:'kiviplaneet',järjekordPäikesest:2,kaugusPäikesest:108.2,läbimõõt:12104,gravitatsioon:8.9,ööpäevaPikkus:2802,aastaPikkus:224.7,temperatuur:464,kuudeArv:0},
      {nimi:'Maa',tüüp:'kiviplaneet',järjekordPäikesest:3,kaugusPäikesest:149.6,läbimõõt:12756,gravitatsioon:9.8,ööpäevaPikkus:24,aastaPikkus:365.2,temperatuur:15,kuudeArv:1},
      {nimi:'Aurelia',tüüp:'kiviplaneet',järjekordPäikesest:4,kaugusPäikesest:175,läbimõõt:10500,gravitatsioon:8.1,ööpäevaPikkus:26,aastaPikkus:450,temperatuur:8,kuudeArv:1},
      {nimi:'Marss',tüüp:'kiviplaneet',järjekordPäikesest:5,kaugusPäikesest:228,läbimõõt:6792,gravitatsioon:3.7,ööpäevaPikkus:24.7,aastaPikkus:687,temperatuur:-65,kuudeArv:2},
      {nimi:'Jupiter',tüüp:'gaasihiid',järjekordPäikesest:6,kaugusPäikesest:778.5,läbimõõt:142984,gravitatsioon:23.1,ööpäevaPikkus:9.9,aastaPikkus:4331,temperatuur:-110,kuudeArv:95},
      {nimi:'Saturn',tüüp:'gaasihiid',järjekordPäikesest:7,kaugusPäikesest:1432,läbimõõt:120536,gravitatsioon:9,ööpäevaPikkus:10.7,aastaPikkus:10747,temperatuur:-140,kuudeArv:274},
      {nimi:'Uraan',tüüp:'jäähiid',järjekordPäikesest:8,kaugusPäikesest:2867,läbimõõt:51118,gravitatsioon:8.7,ööpäevaPikkus:17.2,aastaPikkus:30589,temperatuur:-195,kuudeArv:28},
      {nimi:'Neptuun',tüüp:'jäähiid',järjekordPäikesest:9,kaugusPäikesest:4515,läbimõõt:49528,gravitatsioon:11,ööpäevaPikkus:16.1,aastaPikkus:59800,temperatuur:-200,kuudeArv:16}
    ];
    let planetsData=[];let realScale=false;const scaleToggle=document.getElementById('scale-toggle');
    const typeColors={kiviplaneet:'#b87955',gaasihiid:'#d9b26c',jäähiid:'#82b9b2'};
    function buildOrbitLayout(planets){const svg=document.getElementById('orbits');svg.replaceChildren();positions={};const gap=planets.length>1?700/(planets.length-1):0;const maxDiameter=Math.max(...planets.map(planet=>planet.läbimõõt));const minDiameter=Math.min(...planets.map(planet=>planet.läbimõõt));const layoutScale=Math.max(.68,Math.min(1,Math.sqrt(9/planets.length)));const minimumGap=40;const layoutHeight=690;const locate=(rx,ry,degrees)=>{const angle=degrees*Math.PI/180;const x=-250+rx*Math.cos(angle);const y=470+ry*Math.sin(angle);return{x,y,screenX:x/1000*1160,screenY:y/900*layoutHeight}};const entries=planets.map((planet,index)=>{const size=(72.8+(planet.läbimõõt-minDiameter)/(maxDiameter-minDiameter||1)*145.6)*layoutScale;const radius=size*(assetScales[planet.nimi]||1)/2;const rx=500+index*gap;const ry=260+index*gap*.6;const baseAngle=Math.round(52*Math.sin((index+1)*2.4));const candidates=Array.from({length:73},(_,step)=>{const offset=(step-36)*5;return{...locate(rx,ry,baseAngle+offset),offset}}).filter(candidate=>candidate.screenX>=Math.max(radius+18,190)&&candidate.screenX<=1160-radius-18&&candidate.screenY>=radius+18&&candidate.screenY<=layoutHeight-radius-18&&!(candidate.screenX<410&&candidate.screenY<250)&&!(candidate.screenX>790-radius&&candidate.screenY<135+radius)).sort((a,b)=>Math.abs(a.offset)-Math.abs(b.offset));return{planet,index,radius,rx,ry,candidates}}).sort((a,b)=>b.radius-a.radius);const placed=[];let attempts=0;const solve=depth=>{if(depth===entries.length)return true;if(++attempts>90000)return false;const entry=entries[depth];for(const candidate of entry.candidates){if(placed.every(other=>Math.hypot(candidate.screenX-other.screenX,candidate.screenY-other.screenY)>=entry.radius+other.radius+minimumGap)){placed.push({...candidate,radius:entry.radius,name:entry.planet.nimi});if(solve(depth+1))return true;placed.pop()}}return false};if(!solve(0)){throw new Error('Kattumisvaba paigutust ei leitud')}placed.forEach(item=>{positions[item.name]=[item.x/10,item.y/9]});planets.forEach((planet,index)=>{const rx=500+index*gap;const ry=260+index*gap*.6;const orbit=document.createElementNS('http://www.w3.org/2000/svg','ellipse');orbit.setAttribute('cx','-250');orbit.setAttribute('cy','470');orbit.setAttribute('rx',rx);orbit.setAttribute('ry',ry);svg.append(orbit)})}function placeDetails(planet){const [x,y]=positions[planet.nimi];const card=document.getElementById('planet-card');const toLeft=x>55;const toTop=y>65;card.style.left=(toLeft?x-10:x+9)+'%';card.style.top=(y<30?y+12:y-7)+'%';card.classList.toggle('to-left',toLeft);card.classList.toggle('to-top',toTop)}
    function previewPlanet(button,planet){const space=document.getElementById('space');space.classList.add('is-exploring');space.querySelectorAll('.planet').forEach(item=>item.classList.toggle('is-active',item===button));placeDetails(planet);showDetails(planet);document.getElementById('planet-card').classList.add('is-visible')}
    function clearPlanetPreview(){const space=document.getElementById('space');space.classList.remove('is-exploring');space.querySelectorAll('.planet').forEach(item=>item.classList.remove('is-active'));document.getElementById('planet-card').classList.remove('is-visible')}
    function renderPlanets(planets){const space=document.getElementById('space');document.getElementById('loading')?.remove();clearPlanetPreview();space.querySelectorAll('.planet').forEach(planet=>planet.remove());const maxDiameter=Math.max(...planets.map(planet=>planet.läbimõõt));const minDiameter=Math.min(...planets.map(planet=>planet.läbimõõt));const layoutScale=Math.max(.68,Math.min(1,Math.sqrt(9/planets.length)));const focusSize=realScale?220:218.4*layoutScale;planets.forEach(planet=>{const button=document.createElement('button');button.className='planet';button.dataset.name=planet.nimi;const size=realScale?planet.läbimõõt/maxDiameter*220:(72.8+(planet.läbimõõt-minDiameter)/(maxDiameter-minDiameter)*145.6)*layoutScale;const scale=assetScales[planet.nimi]||1;const labelTop=planet.nimi==='Saturn'?size*1.12:size*(1+scale)/2+8;const activeLabelTop=planet.nimi==='Saturn'?focusSize*1.12:focusSize*(1+scale)/2+8;button.style.setProperty('--x',positions[planet.nimi][0]+'%');button.style.setProperty('--y',positions[planet.nimi][1]+'%');button.style.setProperty('--size',size+'px');button.style.setProperty('--focus-size',focusSize+'px');button.style.setProperty('--asset-scale',scale);button.style.setProperty('--planet-color',typeColors[planet.tüüp]||'#9eb1b2');button.style.setProperty('--label-top',labelTop+'px');button.style.setProperty('--active-label-top',activeLabelTop+'px');button.setAttribute('aria-label',planet.nimi+', ava andmed');const image=document.createElement('img');image.draggable=false;image.src='pildid/'+(imageNames[planet.nimi]||planet.nimi.toLowerCase()+'.png');image.alt='';image.addEventListener('error',()=>button.classList.add('fallback-orb'),{once:true});const name=document.createElement('span');name.className='planet-name';name.textContent=planet.nimi;button.append(image,name);button.addEventListener('pointerenter',()=>previewPlanet(button,planet));button.addEventListener('pointerleave',clearPlanetPreview);button.addEventListener('focus',()=>previewPlanet(button,planet));button.addEventListener('blur',clearPlanetPreview);button.addEventListener('contextmenu',event=>event.preventDefault());button.addEventListener('click',event=>{event.preventDefault();showDetails(planet)});space.append(button);});showDetails(planets.find(planet=>planet.nimi==='Jupiter')||planets[0]);}
    function setPlanets(planets){planetsData=[...planets].sort((a,b)=>a.kaugusPäikesest-b.kaugusPäikesest||a.järjekordPäikesest-b.järjekordPäikesest);buildOrbitLayout(planetsData);scaleToggle.disabled=false;renderPlanets(planetsData)}
    function previewRealDiameters(active){if(realScale===active||!planetsData.length)return;realScale=active;renderPlanets(planetsData)}
    scaleToggle.addEventListener('contextmenu',event=>event.preventDefault());scaleToggle.addEventListener('pointerenter',()=>previewRealDiameters(true));
    scaleToggle.addEventListener('pointerleave',()=>previewRealDiameters(false));
    scaleToggle.addEventListener('focus',()=>previewRealDiameters(true));
    scaleToggle.addEventListener('blur',()=>previewRealDiameters(false));
    document.getElementById('space').addEventListener('click',event=>{if(event.target.closest('.planet'))return;document.activeElement?.blur();clearPlanetPreview()});
    fetch('planeedid.json?cache='+Date.now()).then(response=>{if(!response.ok)throw new Error('Andmeid ei leitud');return response.json()}).then(setPlanets).catch(()=>{const loading=document.getElementById('loading');loading.textContent='Planeetide andmete lugemine ei õnnestunud. Ava leht kohaliku serveri kaudu.';});
  </script>
